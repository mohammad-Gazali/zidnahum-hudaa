# Production stack: Django (Gunicorn) behind Traefik with automatic Let's Encrypt TLS.
#
#   cp .env.example .env        # set ALLOWED_HOST and ACME_EMAIL (plus the app's own vars)
#   docker compose up -d --build
#
# Where things live:
#   - Routing (host rule, TLS, compression, upstream port) -> labels on `web`
#   - Traefik install config                               -> `command:` on `traefik`
#   - There is no traefik/ directory and no templated file. Compose reads ALLOWED_HOST and
#     ACME_EMAIL from .env at `up` time, so Traefik never receives the app's secrets.
#
# TLS notes:
#   - :443 serves HTTPS, :80 only redirects to it (and answers the ACME HTTP challenge).
#   - To test without hitting Let's Encrypt rate limits, add this to .env:
#       ACME_CA=https://acme-staging-v02.api.letsencrypt.org/directory
#     When you switch back to production, delete the acme_data volume first
#     (docker compose down && docker volume rm <project>_acme_data), otherwise Traefik
#     keeps serving the staging certificate it already stored.
#   - /static/ is served by Whitenoise and /media/ by Django, so Traefik only proxies.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    logging: *default-logging
    healthcheck:
      # Plain GET / returns 200 once Gunicorn is up and the entrypoint's
      # migrate/collectstatic have finished. urllib is stdlib, so no extra package.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - sqlite_data:/app/db-data
      - media_data:/app/media
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${ALLOWED_HOST}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.app.middlewares=app-compress"
      - "traefik.http.middlewares.app-compress.compress=true"
      - "traefik.http.services.app.loadbalancer.server.port=8000"

  traefik:
    image: traefik:v3.7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    command:
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--global.sendanonymoususage=false"
      # Health endpoint on the internal :8080 entrypoint (not published).
      - "--ping=true"
      - "--entrypoints.traefik.address=:8080"
      # :80 redirects everything to HTTPS (the ACME HTTP challenge is still answered).
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      # Only containers with traefik.enable=true are routed.
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Let's Encrypt
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read by the Docker provider to discover the labels on `web`.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme_data:/letsencrypt
    healthcheck:
      # Uses the default `traefik` entrypoint (:8080), which is why it's kept as-is above.
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sqlite_data:
  media_data:
  acme_data:

# --- Outgrowing SQLite ---
# Fine for one mosque's data. Note Gunicorn runs several worker processes, so there can be
# concurrent writers; if you ever see "database is locked", move to Postgres:
#   1. add a `db: image: postgres:16-alpine` service with its own named volume,
#   2. add `psycopg[binary]` to the backend's dependencies,
#   3. read DATABASES from environment variables in backend/backend/settings.py.
