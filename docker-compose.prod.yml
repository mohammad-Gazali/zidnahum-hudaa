# For when you're ready to run this via Compose rather than just `docker build`/`docker run`.
#
# Three services: the Django app (behind Gunicorn), an nginx in front of it that
# serves static/media directly and reverse-proxies everything else while
# terminating HTTPS, and a certbot sidecar that issues/renews the Let's Encrypt
# certificate. Everything certificate-related is handled inside docker (named
# volumes only — nothing is set up or stored on the host): on first boot nginx
# seeds a self-signed fallback so it can start, then certbot replaces it with a
# real certificate for the domain in DOMAIN (default wazidnahm.com) and renews
# it forever. Requirements outside the repo are just network-level:
#   - DNS A record for the domain pointing at this host's public IP, and
#   - ports 80 (for the ACME challenge + HTTP→HTTPS redirect) and 443 open.
#
# Usage:
#   cp .env.example .env   # fill in real values (DOMAIN, LETSENCRYPT_EMAIL, ...)
#   docker compose up --build

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    healthcheck:
      # Django serves the SPA root (path "") as a 200 even on a fresh boot, so a
      # plain GET to / tells us Gunicorn + the entrypoint's migrate/collectstatic
      # have finished. urllib is stdlib — no extra package needed for the probe.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      # Both need to survive `docker compose down`/image rebuilds — everything
      # else the container needs is either baked into the image or safely
      # rebuilt on every start (see docker-entrypoint.sh).
      - sqlite_data:/app/db-data
      - media_data:/app/media
      # Shared with nginx so it can serve these directly instead of proxying
      # every asset request through Gunicorn.
      - static_data:/app/staticfiles
    expose:
      - "8000"
    # Uncomment to reach it directly without nginx (e.g. while testing this
    # compose file for the first time):
    # ports:
    #   - "8000:8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    env_file: .env
    # HTTPS on 443, HTTP on 80 (redirect + ACME challenge).
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-entrypoint.sh:/usr/local/bin/nginx-entrypoint.sh:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      # Certificate lifecycle is fully docker-internal: nginx and certbot share
      # these two named volumes (no certificate data lives on the host).
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /usr/local/bin/nginx-entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/run/nginx.pid && kill -0 $$(cat /var/run/nginx.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Issues the real Let's Encrypt certificate on first boot (HTTP-01 challenge,
  # served by nginx on port 80), then renews it forever. No host-side tooling.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    env_file: .env
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ./certbot-entrypoint.sh:/usr/local/bin/certbot-entrypoint.sh:ro
    entrypoint: /usr/local/bin/certbot-entrypoint.sh

volumes:
  sqlite_data:
  media_data:
  static_data:
  certbot_conf:
  certbot_www:

# --- Outgrowing SQLite ---
# SQLite (the app's current, unmodified default) is genuinely fine at this
# scale — a single mosque's data, one writer process. If that ever changes,
# swap in Postgres by:
#   1. adding a `db: image: postgres:16-alpine` service here, with its own
#      named volume for /var/lib/postgresql/data,
#   2. adding `psycopg2-binary` to the backend's dependencies, and
#   3. changing `DATABASES` in backend/backend/settings.py to read the
#      connection details from environment variables instead of the current
#      hardcoded sqlite3 block.
# None of that is done here — it's a real change to application code and
# dependencies, not a Compose-only addition, so it's left as a deliberate
# future step rather than pre-built and unused.
