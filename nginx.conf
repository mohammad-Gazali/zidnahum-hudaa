# Referenced by docker-compose.prod.yml's nginx service. Terminates HTTPS with a
# Let's Encrypt certificate issued/renewed by the certbot service into the shared
# /etc/letsencrypt volume (nginx seeds a self-signed fallback on first boot so it
# can start before the real cert exists). The domain below MUST match DOMAIN in
# .env. Static/media paths must match STATIC_URL/MEDIA_URL in
# backend/backend/settings.py — if either of those ever changes, update the two
# `location` blocks below to match.

# HTTP: answer the ACME HTTP-01 challenge (certbot issuance/renewal needs this to
# stay reachable from the internet), redirect everything else to HTTPS.
server {
    listen 80;
    server_name wazidnahm.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# HTTPS.
server {
    listen 443 ssl;
    http2 on;
    server_name wazidnahm.com;

    ssl_certificate /etc/letsencrypt/live/wazidnahm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wazidnahm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — browsers will refuse plain HTTP for this host for a year.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}