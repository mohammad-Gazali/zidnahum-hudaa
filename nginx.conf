# Referenced by docker-compose.prod.yml's nginx service. Speaks plain HTTP on
# port 80: TLS termination and the HTTP→HTTPS redirect are handled by the
# hosting platform's Traefik, which forwards to this container. Static/media
# paths must match STATIC_URL/MEDIA_URL in backend/backend/settings.py — if
# either of those ever changes, update the two `location` blocks below.

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Traefik already sent the real scheme ("https") — forward it as-is so
        # Django sees the request as TLS rather than re-writing it to "http".
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}